[package]
name = "RDeskMini"
version = "0.1.2"
edition     = "2024"
rust-version = "1.90"
description = "Free alternative to AnyDesk without limitation"
license     = "GPL-3.0-only"
repository  = "https://github.com/waldirborbajr/RDeskMini"
authors     = ["Waldir Borba Junior <wborbajr@gmail.com>"]
readme      = "README.md"

[[bin]]
name = "rdeskmini"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
screenshots = "0.8"
image = "0.25"
enigo = "0.2"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
rustls = "0.23"
rustls-pemfile = "2"
rustls-pki-types = "1"
webpki-roots = "0.26"
rcgen = "0.13"
directories = "5"
openh264 = "0.6"
reed-solomon-erasure = "6"
ring = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
