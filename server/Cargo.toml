[package]
name = "rdesk-relay"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "RDesk relay server: pairs a host and a controller and copies their bytes"
license = "GPL-3.0-only"

[dependencies]
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
